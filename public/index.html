const quiz=document.getElementById("quiz");

questions.forEach((q,index)=>{

const div=document.createElement("div");

div.className="question";

let html=`<h3>${index+1}. ${q.question}</h3>`;

q.options.forEach((option,i)=>{

html+=`
<label>
<input type="radio" name="q${index}" value="${i}">
${option}
</label><br>
`;

});

div.innerHTML=html;

quiz.appendChild(div);

});

function getGrade(percent){

if(percent>=81) return "A";
if(percent>=71) return "B";
if(percent>=61) return "C";
if(percent>=51) return "D";

return "F";

}

async function submitQuiz(){

let score=0;

questions.forEach((q,index)=>{

const selected=document.querySelector(`input[name="q${index}"]:checked`);

const options=document.querySelectorAll(`input[name="q${index}"]`);

options.forEach(opt=>{

opt.parentElement.classList.remove("correct","wrong");

});

if(selected && Number(selected.value)===q.answer){

score++;

selected.parentElement.classList.add("correct");

}else{

if(selected){

selected.parentElement.classList.add("wrong");

}

options[q.answer].parentElement.classList.add("correct");

}

});

const percentage=Math.round(score/questions.length*100);

const grade=getGrade(percentage);

document.getElementById("result").innerHTML=`
Score: ${score}/${questions.length}<br>
Percentage: ${percentage}%<br>
Grade: ${grade}
`;

const name=document.getElementById("studentName").value;

const className=document.getElementById("studentClass").value;

try{

const response=await fetch("/save-result",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

name,
className,
score,
percentage,
grade

})

});

const data=await response.json();

alert(data.message);

}catch(err){

alert("Unable to save result.");

console.log(err);

}

}

let timeLeft=30*60;

const timer=setInterval(()=>{

const minutes=Math.floor(timeLeft/60);

const seconds=timeLeft%60;

document.getElementById("timer").textContent=
`${String(minutes).padStart(2,"0")}:${String(seconds).padStart(2,"0")}`;

timeLeft--;

if(timeLeft<0){

clearInterval(timer);

alert("Time is up!");

submitQuiz();

}

},1000);

</script>

</body>
</html>
