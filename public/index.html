<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ICT Quiz</title>

<style>
body{
    font-family:Arial,sans-serif;
    max-width:900px;
    margin:auto;
    padding:20px;
    background:#f5f5f5;
}

.question{
    background:#fff;
    padding:15px;
    margin-bottom:15px;
    border-radius:8px;
    box-shadow:0 0 5px rgba(0,0,0,.1);
}

button{
    padding:12px 20px;
    font-size:18px;
    cursor:pointer;
    margin-top:20px;
}

.timer-container{
    position:sticky;
    top:10px;
    display:flex;
    justify-content:flex-end;
    background:white;
    padding:10px;
    z-index:1000;
}

#timer{
    font-size:24px;
    color:red;
    border:2px solid red;
    padding:10px 20px;
    border-radius:10px;
    font-weight:bold;
}

.correct{
    background:#ccffcc;
    color:green;
    font-weight:bold;
}

.wrong{
    background:#ffcccc;
    color:red;
    font-weight:bold;
}

#result{
    margin-top:20px;
    font-size:22px;
    font-weight:bold;
}
</style>

</head>
<body>

<h2>ICT Quiz Examination</h2>

<label><b>Student Name</b></label><br>
<input type="text" id="studentName" style="width:100%;padding:10px;"><br><br>

<label><b>Class</b></label><br>
<input type="text" id="studentClass" style="width:100%;padding:10px;"><br><br>

<div class="timer-container">
<div id="timer">30:00</div>
</div>

<div id="quiz"></div>

<button onclick="submitQuiz()">Submit</button>

<div id="result"></div>

<script>

const questions=[

{
question:"What is the first area to examine?",
options:[
"Other people",
"The Telephone",
"Yourself",
"Your habits"
],
answer:2
}

// Paste more questions here

];

const quiz=document.getElementById("quiz");

questions.forEach((q,index)=>{

const div=document.createElement("div");

div.className="question";

let html=`<h3>${index+1}. ${q.question}</h3>`;

q.options.forEach((option,i)=>{

html+=`
<label>
<input type="radio" name="q${index}" value="${i}">
${option}
</label><br>
`;

});

div.innerHTML=html;

quiz.appendChild(div);

});

function getGrade(percent){

if(percent>=81) return "A";
if(percent>=71) return "B";
if(percent>=61) return "C";
if(percent>=51) return "D";

return "F";

}

async function submitQuiz(){

let score=0;

questions.forEach((q,index)=>{

const selected=document.querySelector(`input[name="q${index}"]:checked`);

const options=document.querySelectorAll(`input[name="q${index}"]`);

options.forEach(opt=>{

opt.parentElement.classList.remove("correct","wrong");

});

if(selected && Number(selected.value)===q.answer){

score++;

selected.parentElement.classList.add("correct");

}else{

if(selected){

selected.parentElement.classList.add("wrong");

}

options[q.answer].parentElement.classList.add("correct");

}

});

const percentage=Math.round(score/questions.length*100);

const grade=getGrade(percentage);

document.getElementById("result").innerHTML=`
Score: ${score}/${questions.length}<br>
Percentage: ${percentage}%<br>
Grade: ${grade}
`;

const name=document.getElementById("studentName").value;

const className=document.getElementById("studentClass").value;

try{

const response=await fetch("/save-result",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

name,
className,
score,
percentage,
grade

})

});

const data=await response.json();

alert(data.message);

}catch(err){

alert("Unable to save result.");

console.log(err);

}

}

let timeLeft=30*60;

const timer=setInterval(()=>{

const minutes=Math.floor(timeLeft/60);

const seconds=timeLeft%60;

document.getElementById("timer").textContent=
`${String(minutes).padStart(2,"0")}:${String(seconds).padStart(2,"0")}`;

timeLeft--;

if(timeLeft<0){

clearInterval(timer);

alert("Time is up!");

submitQuiz();

}

},1000);

</script>

</body>
</html>
